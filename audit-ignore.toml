# Accepted dependency risks for the `sca` job (pip-audit --strict).
# Every entry needs id, reason and expires. On the expiry date the sca job
# starts FAILING until the entry is removed (fixed) or re-justified with a new
# date. Nothing is accepted silently or forever. (Shape: security-agents/
# templates/audit-ignore.toml.)
