# Weekly dependency PRs (SECURITY.md RC-7). Minor and patch bumps arrive
# grouped in one PR per ecosystem; majors come one at a time so the test
# suite gates each on its own. (Shape: security-agents/templates/dependabot.yml.)
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it (registry supply-chain
    # rule: a freshly published, later-yanked version never lands here).
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it (registry supply-chain
    # rule: a freshly published, later-yanked version never lands here).
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it (registry supply-chain
    # rule: a freshly published, later-yanked version never lands here).
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
