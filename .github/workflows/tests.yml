name: tests

# Runs the suite on every push and pull request. Until now the tests ran only
# when someone remembered to run them, which means they protected nothing
# against a change made in a hurry.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the Django pin requires; 3.12 catches deprecations
        # early. The pipeline itself is version-agnostic.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements_minimal.txt pins the private security-agents toolkit.
      # TOOLKIT_TOKEN is a fine-grained PAT with read-only Contents on
      # victorzhu443/security-agents (repository secret). Without it the
      # install below fails at that line, loudly.
      - name: Let pip clone the private toolkit
        env: { TOKEN: "${{ secrets.TOOLKIT_TOKEN }}" }
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::TOOLKIT_TOKEN is not set; installing security-agents will fail."
          else
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_minimal.txt
          pip install pytest Django

      - name: Check every file compiles
        run: git ls-files '*.py' | xargs -n1 python -m py_compile

      # No database and no model artifact exist in CI. The suite is built to
      # skip what genuinely needs them rather than fail, so this run proves the
      # logic tests stand on their own -- which is what makes them useful.
      - name: Run tests
        run: pytest tests/ -q --tb=short

      - name: Verify the schema definition applies to an empty database
        run: |
          python -m data_ingestion.schema --migrate
          python -m data_ingestion.schema --check
