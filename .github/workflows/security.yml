name: security

# Three enforcement jobs (SECURITY.md, "Enforcement lives in CI"): the security
# test suite, SAST, and dependency audit. Shapes follow
# security-agents/.github/workflows/security-reusable.yml; switch to `uses:`
# on that reusable workflow once it is tagged.
#
# The shared toolkit `security-agents` is a public repository: every install
# and checkout below works anonymously. TOOLKIT_TOKEN (a fine-grained PAT with
# read-only Contents on victorzhu443/security-agents) is optional and is used
# only if set, so nothing breaks if the toolkit is ever made private again.
on:
  push:
    branches: [main, "security/**"]
  pull_request:

permissions:
  contents: read

env:
  TOOLKIT_REPO: victorzhu443/security-agents
  TOOLKIT_REF: v0.1.1   # keep in step with the pin in requirements*.txt

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      # security-agents is public: a plain pip install resolves the git pin
      # anonymously. TOOLKIT_TOKEN is optional and only honoured if set (for
      # the case the toolkit is ever made private again).
      - name: Use TOOLKIT_TOKEN for the toolkit clone, if one is configured
        env: { TOKEN: "${{ secrets.TOOLKIT_TOKEN }}" }
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: pip install -r requirements_minimal.txt pytest hypothesis Django sqlalchemy
      - name: Security suite (boundary, access control, zip budgets, secrets, proxy, fuzz, LLM01)
        run: pytest tests/security/ -q --tb=short

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the toolkit (custom Semgrep rules)
        # Public repo: github.token is enough; TOOLKIT_TOKEN is used if set.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOLKIT_REPO }}
          ref: ${{ env.TOOLKIT_REF }}
          token: ${{ secrets.TOOLKIT_TOKEN || github.token }}
          path: .security-agents
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install semgrep
      - name: Semgrep (custom rules + python/django/secrets/kubernetes packs)
        run: >
          semgrep scan --config .security-agents/semgrep/rules.yml
          --config p/python --config p/django --config p/secrets --config p/kubernetes
          --error --metrics off --exclude .security-agents .

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Install pip-audit in its own venv (its dependencies are never audited as the project's)
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet --upgrade pip pip-audit
          echo "$RUNNER_TEMP/audit/bin" >> "$GITHUB_PATH"
      - name: Build the list to audit
        # pip-audit can only audit what is on PyPI: the VCS-pinned toolkit is
        # dropped here and audited by its own CI.
        run: |
          grep -v -E '^[[:space:]]*-e[[:space:]]|git\+|security-agents' requirements.txt > "$RUNNER_TEMP/req.txt"
          echo "Auditing:"; cat "$RUNNER_TEMP/req.txt"
      - name: Accepted risks from audit-ignore.toml (an expired entry fails the job)
        id: ignores
        run: |
          python - <<'PY'
          import datetime as dt, os, pathlib, re, sys, tomllib
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          path = pathlib.Path("audit-ignore.toml")
          if not path.is_file():
              print("no audit-ignore.toml; nothing ignored"); out.write("args=\n"); sys.exit(0)
          today, args, errors = dt.date.today(), [], []
          for e in tomllib.loads(path.read_text()).get("ignore", []):
              vid, reason, exp = e.get("id"), e.get("reason"), e.get("expires")
              if not (vid and reason and exp):
                  errors.append(f"entry {vid or '?'}: every entry needs id, reason and expires"); continue
              if not re.fullmatch(r"[A-Za-z0-9._-]+", vid):
                  errors.append(f"entry {vid}: id must be a bare advisory id"); continue
              if isinstance(exp, dt.datetime): exp = exp.date()
              elif isinstance(exp, str): exp = dt.date.fromisoformat(exp)
              if exp < today:
                  errors.append(f"{vid}: ignore expired on {exp.isoformat()} -- fix it or re-justify ({reason})"); continue
              print(f"ignoring {vid} until {exp.isoformat()}: {reason}")
              args += ["--ignore-vuln", vid]
          for msg in errors:
              print(f"::error file={path}::{msg}")
          if errors:
              sys.exit(1)
          out.write("args=" + " ".join(args) + "\n")
          PY
      - name: pip-audit (pinned requirements)
        run: >
          pip-audit --strict --progress-spinner off -r "$RUNNER_TEMP/req.txt" --no-deps
          ${{ steps.ignores.outputs.args }}
