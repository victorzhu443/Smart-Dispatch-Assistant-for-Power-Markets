# k8s-forecast-deployment.yaml - Forecast API Deployment for Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-api
  namespace: smart-dispatch
  labels:
    app: forecast-api
    component: forecasting
    version: v1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forecast-api
  template:
    metadata:
      labels:
        app: forecast-api
        component: forecasting
        version: v1.0
    spec:
      # Hardening defaults (SECURITY.md RC-9): the image already runs as an
      # unprivileged user; the pod refuses to run otherwise and drops every
      # capability. The root filesystem is read-only -- the API only reads the
      # mounted database and the model artifact, and writes nothing but logs
      # to stdout. /tmp is a writable emptyDir for Python/gunicorn scratch.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: forecast-api
        image: smart-dispatch-forecast:latest
        imagePullPolicy: Never  # Use local image
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5001
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONUNBUFFERED
          value: "1"
        # Access control (RC-5/RC-6): APP_ENV=production makes a missing key a
        # startup failure, never a dev default. Create the secret out of band:
        #   kubectl -n smart-dispatch create secret generic forecast-api \
        #     --from-literal=FORECAST_API_KEY="$(openssl rand -hex 32)"
        - name: APP_ENV
          value: "production"
        - name: FORECAST_API_KEY
          valueFrom:
            secretKeyRef:
              name: forecast-api
              key: FORECAST_API_KEY
        - name: DASHBOARD_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: forecast-config
              key: DASHBOARD_ORIGIN
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: market-data
          mountPath: /app/market_data.db
          subPath: market_data.db
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: market-data
        hostPath:
          path: /tmp/smart-dispatch-data
          type: DirectoryOrCreate
      - name: tmp
        emptyDir: {}
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: forecast-api-service
  namespace: smart-dispatch
  labels:
    app: forecast-api
    component: forecasting
spec:
  selector:
    app: forecast-api
  ports:
  - name: http
    port: 80
    targetPort: 5001
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forecast-config
  namespace: smart-dispatch
data:
  FLASK_ENV: "production"
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"
  # The one origin allowed by CORS: the Django dashboard. Browsers never call
  # the API directly (Django proxies and holds the key), so this is belt and
  # braces rather than the gate.
  DASHBOARD_ORIGIN: "http://localhost:8000"