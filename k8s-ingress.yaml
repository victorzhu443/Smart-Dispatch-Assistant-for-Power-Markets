apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-dispatch-ingress
  namespace: smart-dispatch
  # Access control at the edge (SECURITY.md RC-6, layer 1). These are
  # ingress-nginx annotations, matching `ingressClassName: nginx` below; the
  # application enforces the same bearer-token check itself, so the ingress is
  # defence in depth rather than the only gate. If the cluster runs a different
  # ingress class, translate these to its equivalents.
  annotations:
    # Basic-auth gate in front of /forecast. Create the credential file with
    #   htpasswd -c auth operator && kubectl -n smart-dispatch create secret \
    #     generic forecast-ingress-auth --from-file=auth
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: forecast-ingress-auth
    nginx.ingress.kubernetes.io/auth-realm: "Smart Dispatch forecast API"
    # Per-client throttle; the application's own limit (60/min per key) still
    # applies behind it.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Request-size and timeout ceilings for a read-only GET API.
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /forecast
        pathType: Prefix
        backend:
          service:
            name: forecast-service
            port:
              number: 80
